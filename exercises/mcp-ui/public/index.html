<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MCP Tool Workshop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>MCP Tool Workshop</h1>
      <p>Browser interface for the course's Node.js MCP starter.</p>
      <h2>Available tools</h2>
      <button id="refresh">Refresh tools</button
      ><label for="filter">Filter tools</label
      ><input id="filter" type="search" />
      <ul id="tools"></ul>
      <h2>Add two numbers</h2>
      <form id="calculator">
        <label for="a">First number</label
        ><input
          id="a"
          name="a"
          type="number"
          step="any"
          required
          value="2"
        /><label for="b">Second number</label
        ><input
          id="b"
          name="b"
          type="number"
          step="any"
          required
          value="3"
        /><button id="calculate">Call MCP tool</button>
      </form>
      <p id="result" role="status">Ready.</p>
      <h2>Request history</h2>
      <button id="clear">Clear history</button>
      <ol id="history"></ol>
      <footer>
        Based on lucianoayres/mcp-server-node (MIT). Addition runs through the
        MCP SDK and stdio server.
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
